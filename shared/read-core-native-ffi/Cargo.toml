[package]
name = "floently-read-core-native"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
name = "floently_read_core_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
floently-read-core = { path = "../read-core-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
