name: Read progress sync Android qualification

on:
  push:
    branches:
      - build/read-native-progress-sync-20261004

concurrency:
  group: read-progress-sync-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate ReadingManifest contract
        run: python3 scripts/validate_read_manifest_contract.py
      - name: Test shared Read core
        run: cargo test --manifest-path shared/read-core-rust/Cargo.toml
      - name: Test native FFI adapter
        run: cargo test --manifest-path shared/read-core-native-ffi/Cargo.toml

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 3.5.4
      - name: Build shared Rust Read Core for Android
        run: bash scripts/build_read_native_core_android.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Floently Read Android debug APK
        working-directory: apps/android
        run: gradle :FloentlyRead:app:assembleDebug --no-daemon --stacktrace
