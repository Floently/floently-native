name: Read mobile browser CI

on:
  pull_request:
    paths:
      - "apps/ios/FloentlyRead/**"
      - "apps/ios/FloentlyShared/**"
      - "apps/android/FloentlyRead/**"
      - "apps/android/shared/**"
      - "apps/android/settings.gradle.kts"
      - "apps/android/build.gradle.kts"
      - "shared/api-contracts/read/**"
      - "shared/read-core-rust/**"
      - "docs/NEXT_APP_POLYGLOT_TECHNOLOGY_STANDARD.md"
      - "docs/SPEECHIFY_ARCHITECTURE_STUDY_20260930.md"
      - "docs/READ_MOBILE_BROWSER_COMPATIBILITY_0330.md"
      - "docs/design/READ_MOBILE_BROWSER_UX_SPEC_0330.md"
      - "scripts/validate_read_mobile_browser_0330.sh"
      - ".github/workflows/read-mobile-browser-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/ios/FloentlyRead/**"
      - "apps/ios/FloentlyShared/**"
      - "apps/android/FloentlyRead/**"
      - "apps/android/shared/**"
      - "apps/android/settings.gradle.kts"
      - "apps/android/build.gradle.kts"
      - "shared/api-contracts/read/**"
      - "shared/read-core-rust/**"
      - "docs/NEXT_APP_POLYGLOT_TECHNOLOGY_STANDARD.md"
      - "docs/SPEECHIFY_ARCHITECTURE_STUDY_20260930.md"
      - "docs/READ_MOBILE_BROWSER_COMPATIBILITY_0330.md"
      - "docs/design/READ_MOBILE_BROWSER_UX_SPEC_0330.md"
      - "scripts/validate_read_mobile_browser_0330.sh"
      - ".github/workflows/read-mobile-browser-ci.yml"

permissions:
  contents: read

jobs:
  read-core-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Test shared Floently Read core
        run: cargo test --manifest-path shared/read-core-rust/Cargo.toml --locked

  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate universal mobile browser contracts
        run: bash scripts/validate_read_mobile_browser_0330.sh

  android-read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Floently Read Android debug APK
        working-directory: apps/android
        run: gradle :FloentlyRead:app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FloentlyRead-Android-debug-${{ github.sha }}
          path: apps/android/FloentlyRead/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios-read:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Floently Read Xcode project
        working-directory: apps/ios/FloentlyRead
        run: xcodegen generate
      - name: Build Floently Read for iPhone simulator
        working-directory: apps/ios/FloentlyRead
        run: >-
          xcodebuild
          -project FloentlyRead.xcodeproj
          -scheme FloentlyRead
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
