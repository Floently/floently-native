name: Read mobile browser CI

on:
  pull_request:
    paths:
      - "apps/ios/FloentlyRead/**"
      - "apps/ios/FloentlyShared/**"
      - "apps/android/FloentlyRead/**"
      - "apps/android/shared/**"
      - "apps/android/settings.gradle.kts"
      - "apps/android/build.gradle.kts"
      - "shared/api-contracts/read/**"
      - "shared/read-core-rust/**"
      - "shared/read-core-wasm/**"
      - "shared/read-core-native-ffi/**"
      - "apps/web/FloentlyReadWeb/**"
      - "scripts/build_read_web_wasm.sh"
      - "scripts/build_read_native_core_ios.sh"
      - "scripts/build_read_native_core_android.sh"
      - "docs/NEXT_APP_POLYGLOT_TECHNOLOGY_STANDARD.md"
      - "docs/SPEECHIFY_ARCHITECTURE_STUDY_20260930.md"
      - "docs/READ_MOBILE_BROWSER_COMPATIBILITY_0330.md"
      - "docs/design/READ_MOBILE_BROWSER_UX_SPEC_0330.md"
      - "scripts/validate_read_mobile_browser_0330.sh"
      - "scripts/validate_read_manifest_contract.py"
      - ".github/workflows/read-mobile-browser-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/ios/FloentlyRead/**"
      - "apps/ios/FloentlyShared/**"
      - "apps/android/FloentlyRead/**"
      - "apps/android/shared/**"
      - "apps/android/settings.gradle.kts"
      - "apps/android/build.gradle.kts"
      - "shared/api-contracts/read/**"
      - "shared/read-core-rust/**"
      - "shared/read-core-wasm/**"
      - "shared/read-core-native-ffi/**"
      - "apps/web/FloentlyReadWeb/**"
      - "scripts/build_read_web_wasm.sh"
      - "scripts/build_read_native_core_ios.sh"
      - "scripts/build_read_native_core_android.sh"
      - "docs/NEXT_APP_POLYGLOT_TECHNOLOGY_STANDARD.md"
      - "docs/SPEECHIFY_ARCHITECTURE_STUDY_20260930.md"
      - "docs/READ_MOBILE_BROWSER_COMPATIBILITY_0330.md"
      - "docs/design/READ_MOBILE_BROWSER_UX_SPEC_0330.md"
      - "scripts/validate_read_mobile_browser_0330.sh"
      - "scripts/validate_read_manifest_contract.py"
      - ".github/workflows/read-mobile-browser-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  read-manifest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate ReadingManifest v1 fixture and invariants
        run: python3 scripts/validate_read_manifest_contract.py

  read-core-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Test shared Floently Read core
        run: cargo test --manifest-path shared/read-core-rust/Cargo.toml
      - name: Test Rust WebAssembly adapter
        run: cargo test --manifest-path shared/read-core-wasm/Cargo.toml
      - name: Test native Rust FFI adapter
        run: cargo test --manifest-path shared/read-core-native-ffi/Cargo.toml

  read-web-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install WebAssembly Rust target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0
      - name: Build Rust/WASM + React Read web
        run: bash scripts/build_read_web_wasm.sh
      - name: Test document-wide web playback contracts
        working-directory: apps/web/FloentlyReadWeb
        run: npm test
      - name: Upload Read web production bundle
        uses: actions/upload-artifact@v4
        with:
          name: FloentlyRead-Web-${{ github.sha }}
          path: apps/web/FloentlyReadWeb/dist
          if-no-files-found: error
          retention-days: 7

  read-web-e2e:
    needs: read-web-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Read web test dependencies
        working-directory: apps/web/FloentlyReadWeb
        run: npm install --no-audit --no-fund
      - name: Download built Read web bundle
        uses: actions/download-artifact@v4
        with:
          name: FloentlyRead-Web-${{ github.sha }}
          path: apps/web/FloentlyReadWeb/dist
      - name: Install Playwright Chromium
        working-directory: apps/web/FloentlyReadWeb
        run: npx playwright install --with-deps chromium
      - name: Qualify Read web product journeys
        working-directory: apps/web/FloentlyReadWeb
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloentlyRead-Web-Playwright-${{ github.sha }}
          path: apps/web/FloentlyReadWeb/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate universal mobile browser contracts
        run: bash scripts/validate_read_mobile_browser_0330.sh

  android-read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 3.5.4
      - name: Build shared Rust Read Core for Android
        run: bash scripts/build_read_native_core_android.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Floently Read Android debug APK
        working-directory: apps/android
        run: gradle :FloentlyRead:app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FloentlyRead-Android-debug-${{ github.sha }}
          path: apps/android/FloentlyRead/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios-read:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build shared Rust Read Core for Apple platforms
        run: bash scripts/build_read_native_core_ios.sh
      - name: Generate Floently Read Xcode project
        working-directory: apps/ios/FloentlyRead
        run: xcodegen generate
      - name: Build Floently Read for iPhone simulator
        working-directory: apps/ios/FloentlyRead
        run: >-
          xcodebuild
          -project FloentlyRead.xcodeproj
          -scheme FloentlyRead
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
