name: Read first-release Swift syntax qualification

on:
  push:
    branches:
      - build/read-native-first-release-shell-20261004
    paths:
      - "apps/ios/**/*.swift"
      - "apps/ios/**/PrivacyInfo.xcprivacy"
      - ".github/workflows/read-first-release-swift-syntax.yml"

concurrency:
  group: read-first-release-swift-syntax-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Parse all native Swift sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            echo "Parsing $source"
            swiftc -parse "$source"
          done < <(
            find apps/ios/FloentlyRead/FloentlyRead                  apps/ios/FloentlyShared/Sources                  -type f -name '*.swift' -print0
          )
      - name: Validate Read privacy manifest
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          path = Path("apps/ios/FloentlyRead/FloentlyRead/PrivacyInfo.xcprivacy")
          payload = plistlib.loads(path.read_bytes())

          assert payload.get("NSPrivacyTracking") is False
          accessed = {
              item["NSPrivacyAccessedAPIType"]: set(
                  item["NSPrivacyAccessedAPITypeReasons"]
              )
              for item in payload.get("NSPrivacyAccessedAPITypes", [])
          }
          assert "CA92.1" in accessed.get(
              "NSPrivacyAccessedAPICategoryUserDefaults",
              set(),
          )
          file_reasons = accessed.get(
              "NSPrivacyAccessedAPICategoryFileTimestamp",
              set(),
          )
          assert {"C617.1", "3B52.1"} <= file_reasons

          collected = {
              item["NSPrivacyCollectedDataType"]
              for item in payload.get("NSPrivacyCollectedDataTypes", [])
          }
          assert {
              "NSPrivacyCollectedDataTypeName",
              "NSPrivacyCollectedDataTypeEmailAddress",
              "NSPrivacyCollectedDataTypeUserID",
              "NSPrivacyCollectedDataTypeOtherUserContent",
              "NSPrivacyCollectedDataTypeBrowsingHistory",
          } <= collected
          PY
      - name: Type-check pure access model
        run: |
          swiftc -typecheck             apps/ios/FloentlyShared/Sources/FloentlyShared/Billing/FloentlyAccessModels.swift
      - name: Type-check pure auth models
        run: |
          swiftc -typecheck             apps/ios/FloentlyShared/Sources/FloentlyShared/Auth/FloentlyAuthModels.swift
